name: Yarn Install
description: >-
  This is a composite action that does everything needed to do `yarn install`.
inputs:
  GOARCH:
    description: Target architecture
    default: amd64

runs:
  using: composite
  steps:
  # In case we're running on a self-hosted runner without `yarn` installed,
  # set up NodeJS, enable `yarn`, and then handle the caching.
  - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version-file: package.json
  - run: corepack enable yarn
    shell: bash
  - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version-file: package.json
      cache: yarn

  - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
    with:
      go-version-file: rdd/go.mod
      cache-dependency-path: src/go/**/go.sum

  - name: Install Windows dependencies
    if: runner.os == 'Windows'
    shell: powershell
    run: .\scripts\windows-setup.ps1 -SkipTools

  # The Windows arm64 runners' mingw gcc targets x86_64, so cgo cannot
  # assemble Go's arm64 runtime with it. Their bundled clang targets MSVC,
  # whose CRT never runs the .ctors section where Go's linker puts a c-shared
  # DLL's runtime init, so the installer's custom action DLL would hang.
  # llvm-mingw targets arm64 and links the mingw CRT.
  - name: Install the arm64 C compiler
    if: runner.os == 'Windows' && inputs.GOARCH == 'arm64'
    shell: pwsh
    working-directory: ${{ runner.temp }}
    env:
      LLVM_MINGW: llvm-mingw-20261006-ucrt-aarch64
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-aarch64.zip
      LLVM_MINGW_SHA256: 9a835d5179c9f3a5a783c11a7f14062a249b4765dd11add64a66786864e82ab2
    run: |
      Invoke-WebRequest -UseBasicParsing -Uri $env:LLVM_MINGW_URL -OutFile "$env:LLVM_MINGW.zip"
      $hash = (Get-FileHash -Algorithm SHA256 "$env:LLVM_MINGW.zip").Hash
      if ($hash -ne $env:LLVM_MINGW_SHA256) {
        throw "$env:LLVM_MINGW.zip has SHA256 $hash, expected $env:LLVM_MINGW_SHA256"
      }
      # Windows' tar.exe is bsdtar, which reads zip archives.
      # GNU tar does not, and it may come first on PATH.
      & "$env:SystemRoot\System32\tar.exe" -xf "$env:LLVM_MINGW.zip"
      if ($LASTEXITCODE -ne 0) { throw "tar.exe exited with $LASTEXITCODE" }
      Join-Path $PWD "$env:LLVM_MINGW\bin" | Out-File -Encoding utf8 -Append $env:GITHUB_PATH
      'CC=aarch64-w64-mingw32-clang' | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

  - name: Build RDD
    shell: bash
    run: make build-rdd
    working-directory: rdd
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - run: yarn install --immutable
    shell: bash
    env:
      GOARCH: ${{ inputs.GOARCH }}

  - name: Fix electron sandbox
    if: runner.os == 'Linux'
    shell: bash
    run: |
      sudo chown root node_modules/electron/dist/chrome-sandbox
      sudo chmod 04755 node_modules/electron/dist/chrome-sandbox
